services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hmc-db
      POSTGRES_USER: hmc-user
      POSTGRES_PASSWORD: hmc-password
    ports:
      - "5432:5432"
    volumes:
      - hmc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmc-user -d hmc-db"]
      interval: 5s
      retries: 5

volumes:
  hmc-pgdata:
