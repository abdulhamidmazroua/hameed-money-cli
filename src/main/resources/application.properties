spring.application.name=hameed-money-cli

# Database
spring.datasource.url=jdbc:sqlite:${user.home}/.hmc/hmc.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.hibernate.ddl-auto=update

# CLI polish — suppress startup noise
spring.main.banner-mode=off
spring.main.web-application-type=none
logging.level.root=WARN
spring.output.ansi.enabled=never
spring.jpa.open-in-view=false

# User config (API keys, provider selection)
hmc.config.path=${user.home}/.hmc/config.json

# Report output directory
hmc.report.output-dir=${user.home}/.hmc/reports

# EODHD provider — technical endpoints (API key lives in config.json)
hmc.market.data.provider.eodhd.base-url=https://eodhd.com/api
hmc.market.data.provider.eodhd.endpoint.exchange-symbol-list=https://eodhd.com/api/exchange-symbol-list

# Twelve Data provider — technical endpoints (API key lives in config.json)
hmc.market.data.provider.twelve-data.base-url=https://api.twelvedata.com
hmc.market.data.provider.twelve-data.endpoint.stocks=/stocks
