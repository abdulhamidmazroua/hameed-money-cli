spring.application.name=hameed-money-cli

# add datasource configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hmc-db
spring.datasource.username=hmc-user
spring.datasource.password=hmc-password
spring.datasource.hikari.schema=app_data
spring.datasource.driver-class-name=org.postgresql.Driver


# custom
hmc.report.output-dir=/hmc/reports

hmc.market.data.provider.twelve-date.base-url=https://api.twelvedata.com
hmc.market.data.provider.twelve-data.api-key=${TWELVE_DATA_API_KEY}
hmc.market.data.provider.twelve-data.endpoint.stocks=/stocks

hmc.market.data.provider.default=${HMC_MARKET_DATA_PROVIDER:eodhd}

hmc.market.data.provider.eodhd.base-url=https://eodhd.com/api
hmc.market.data.provider.eodhd.api-key=${EODHD_API_KEY}
hmc.market.data.provider.eodhd.endpoint.exchange-symbol-list=https://eodhd.com/api/exchange-symbol-list
