spring.application.name=hameed-money-cli

# Database
spring.datasource.url=${HMC_DB_URL:jdbc:postgresql://localhost:5432/hmc-db}
spring.datasource.username=${HMC_DB_USER:hmc-user}
spring.datasource.password=${HMC_DB_PASSWORD:hmc-password}
spring.datasource.hikari.schema=${HMC_DB_SCHEMA:app_data}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase migrations
spring.liquibase.default-schema=app_data

# CLI polish — suppress startup noise
spring.main.banner-mode=off
logging.level.root=WARN
spring.output.ansi.enabled=never
spring.jpa.open-in-view=false

# Report output directory
hmc.report.output-dir=${HMC_REPORT_OUTPUT_DIR:/hmc/reports}

# Market data provider selection
hmc.market.data.provider.default=${HMC_MARKET_DATA_PROVIDER:eodhd}

# EODHD provider
hmc.market.data.provider.eodhd.base-url=${HMC_EODHD_BASE_URL:https://eodhd.com/api}
hmc.market.data.provider.eodhd.api-key=${EODHD_API_KEY:}
hmc.market.data.provider.eodhd.endpoint.exchange-symbol-list=${HMC_EODHD_EXCHANGE_SYMBOL_LIST_ENDPOINT:https://eodhd.com/api/exchange-symbol-list}

# Twelve Data provider
hmc.market.data.provider.twelve-date.base-url=${HMC_TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
hmc.market.data.provider.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
hmc.market.data.provider.twelve-data.endpoint.stocks=${HMC_TWELVE_DATA_STOCKS_ENDPOINT:/stocks}
